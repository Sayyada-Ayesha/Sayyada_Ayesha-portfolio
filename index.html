<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#0a0e0e" />

    <title>

    </title>

    <meta
      name="description"
      content="Sayyada Ayesha — Founder of SYNX AI Horizon, IT graduate and creative technologist working across AI, automation, digital design, UI/UX and web development."
    />

    <link
      rel="canonical"
      href="https://sayyada-ayesha.github.io/Sayyada_Ayesha-portfolio/"
    />

    <!-- Netlify Identity -->
    <script
      src="https://identity.netlify.com/v1/netlify-identity-widget.js"
      type="text/javascript"
    ></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Sayyada Ayesha | AI Founder, Creative Technologist & Digital Builder"
    />
    <meta
      property="og:description"
      content="Founder of SYNX AI Horizon — AI, automation, design and digital products."
    />
    <meta
      property="og:url"
      content="https://sayyada-ayesha.github.io/Sayyada_Ayesha-portfolio/"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sayyada Ayesha | AI Founder, Creative Technologist & Digital Builder"
    />
    <meta
      name="twitter:description"
      content="Founder of SYNX AI Horizon — AI, automation, design and digital products."
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!--
      Decap CMS + Netlify Identity:
      When a user logs in successfully from the main site,
      redirect them to the CMS.
      
      IMPORTANT:
      Do NOT redirect on "init" when a user exists.
      Invite acceptance must be handled by Netlify Identity first.
    -->
    <script type="text/javascript">
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function (user) {
          if (!user) {
            window.netlifyIdentity.on("login", function () {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
